<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Null Links Navigator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  header { background: #1e293b; border-bottom: 1px solid #334155; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
  header h1 { font-size: 14px; font-weight: 600; color: #94a3b8; white-space: nowrap; }

  .progress-wrap { flex: 1; min-width: 100px; }
  .progress-bar { height: 5px; background: #334155; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: #22c55e; border-radius: 3px; transition: width 0.3s; }
  .progress-text { font-size: 11px; color: #64748b; margin-top: 3px; text-align: right; }

  .controls { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .btn { border: none; border-radius: 6px; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .btn-prev { background: #334155; color: #94a3b8; }
  .btn-prev:hover { background: #475569; }
  .btn-open { background: #2563eb; color: white; font-size: 14px; padding: 8px 18px; }
  .btn-open:hover { background: #1d4ed8; }
  .btn-next { background: #334155; color: #94a3b8; }
  .btn-next:hover { background: #475569; }
  .btn-load { background: #0f766e; color: #99f6e4; font-size: 12px; padding: 6px 10px; }
  .btn-load:hover { background: #0d9488; }
  .btn-playpause { background: #4a1d96; color: #c4b5fd; }
  .btn-playpause:hover { background: #5b21b6; }
  .btn-playpause.running { background: #7c2d12; color: #fdba74; }
  .btn-playpause.running:hover { background: #9a3412; }
  .btn-reset:hover { background: #991b1b; }
  #fileInput { display: none; }

  .main { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }

  .current-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; flex-shrink: 0; }
  .current-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .current-id-row { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
  .current-id { font-size: 19px; font-weight: 700; color: #60a5fa; font-family: monospace; text-decoration: none; }
  .current-id:hover { color: #93c5fd; text-decoration: underline; }
  .current-url { font-size: 11px; color: #475569; word-break: break-all; }
  .done-badge { display: inline-block; background: #14532d; color: #4ade80; font-size: 11px; padding: 2px 8px; border-radius: 99px; margin-top: 5px; }

  /* countdown ring */
  .countdown-wrap { display: flex; align-items: center; gap: 8px; }
  .ring-svg { transform: rotate(-90deg); cursor: pointer; }
  .ring-bg { fill: none; stroke: #334155; stroke-width: 3; }
  .ring-fill { fill: none; stroke: #3b82f6; stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 50.27; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
  .ring-num { font-size: 11px; color: #94a3b8; min-width: 18px; text-align: center; }
  .btn-cancel { background: #334155; color: #94a3b8; font-size: 11px; padding: 3px 8px; border: none; border-radius: 4px; cursor: pointer; }
  .btn-cancel:hover { background: #475569; }

  .list-header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .list-header span { font-size: 12px; color: #64748b; }
  .search-input { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 5px 9px; color: #e2e8f0; font-size: 13px; width: 150px; outline: none; }
  .search-input:focus { border-color: #3b82f6; }

  .list-wrap { flex: 1; min-height: 0; overflow-y: auto; background: #1e293b; border: 1px solid #334155; border-radius: 10px; }
  .list-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #1a2332; cursor: pointer; transition: background 0.1s; }
  .list-item:last-child { border-bottom: none; }
  .list-item:hover { background: #273548; }
  .list-item.active { background: #1e3a5f; border-left: 3px solid #3b82f6; }
  .list-item.done { opacity: 0.4; }
  .item-idx { font-size: 11px; color: #475569; width: 36px; flex-shrink: 0; text-align: right; }
  .item-id { font-size: 13px; font-family: monospace; color: #e2e8f0; flex: 1; }
  .item-check { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #334155; flex-shrink: 0; position: relative; }
  .item-check.checked { background: #22c55e; border-color: #22c55e; }
  .item-check.checked::after { content: ""; position: absolute; left: 3px; top: 1px; width: 5px; height: 8px; border: 2px solid white; border-top: none; border-left: none; transform: rotate(45deg); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e3a5f; color: #93c5fd; border: 1px solid #3b82f6; border-radius: 8px; padding: 8px 16px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🔗 Null Links</h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>
  <div class="controls">
    <button class="btn btn-prev" onclick="move(-1)" title="←">◀</button>
    <button class="btn btn-open" onclick="openCurrent()" title="Space/Enter">🔗 Mở</button>
    <button class="btn btn-next" onclick="move(1)" title="→">▶</button>
    <button class="btn btn-playpause" id="btnPlay" onclick="togglePlay()" title="P">▶ Chạy</button>
    <button class="btn btn-load" onclick="document.getElementById('fileInput').click()">📂 Load Excel</button>
    <button class="btn btn-reset" onclick="clearDB()">🗑 Xóa DB</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="loadExcel(this)">
  </div>
</header>

<div class="main">
  <div class="current-card">
    <div class="current-label">Đang chọn</div>
    <div class="current-id-row">
      <a class="current-id" id="curLink" href="#" target="_blank" onclick="markCurrentDone()">—</a>
      <div class="countdown-wrap" id="countdownWrap" style="display:none">
        <svg class="ring-svg" width="22" height="22" viewBox="0 0 22 22" onclick="cancelCountdown()">
          <circle class="ring-bg" cx="11" cy="11" r="8"/>
          <circle class="ring-fill" id="ringFill" cx="11" cy="11" r="8"/>
        </svg>
        <span class="ring-num" id="ringNum">10</span>
        <button class="btn-cancel" onclick="cancelCountdown()">✕</button>
      </div>
    </div>
    <div class="current-url" id="curUrl">—</div>
    <div id="curDone"></div>
  </div>

  <div class="list-header">
    <span id="listInfo"></span>
    <input class="search-input" id="searchInput" placeholder="🔍 Tìm notifyNo..." oninput="onSearch(this.value)">
  </div>

  <div class="list-wrap" id="listWrap"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SEED = [{"id": "IB2300386035", "url": "https://mscd1.duoctrexanh.workers.dev/result?notifyNo=IB2300386035&refresh=1"}];
const DATA_KEY = 'null_links_data_v3';
const DONE_KEY = 'null_links_done_v3';
const POS_KEY  = 'null_links_pos_v3';

let DATA = [];
let done = new Set();
let filtered = [];
let currentIdx = 0;

// countdown
let cdTimer = null;
let cdSec = 0;
const CIRC = 2 * Math.PI * 8; // 50.27

function loadState() {
  try { DATA = JSON.parse(localStorage.getItem(DATA_KEY)) || [...SEED]; } catch { DATA = [...SEED]; }
  try { done = new Set(JSON.parse(localStorage.getItem(DONE_KEY))); } catch { done = new Set(); }
  const posId = localStorage.getItem(POS_KEY);
  if (posId) { const i = DATA.findIndex(r => r.id === posId); currentIdx = i >= 0 ? i : 0; }
}
function saveData() { localStorage.setItem(DATA_KEY, JSON.stringify(DATA)); }
function saveDone() { localStorage.setItem(DONE_KEY, JSON.stringify([...done])); }
function savePos()  { if (DATA[currentIdx]) localStorage.setItem(POS_KEY, DATA[currentIdx].id); }

let playing = false;

function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('btnPlay');
  if (playing) {
    btn.textContent = '⏸ Dừng'; btn.classList.add('running');
    startCountdown();
  } else {
    btn.textContent = '▶ Chạy'; btn.classList.remove('running');
    cancelCountdown();
  }
}

function stopPlay() {
  playing = false;
  const btn = document.getElementById('btnPlay');
  btn.textContent = '▶ Chạy'; btn.classList.remove('running');
}
function startCountdown() {
  cancelCountdown();
  if (!playing) return;
  cdSec = 10;
  document.getElementById('countdownWrap').style.display = 'flex';
  updateRing();
  cdTimer = setInterval(() => {
    cdSec--;
    updateRing();
    if (cdSec <= 0) {
      clearInterval(cdTimer); cdTimer = null;
      document.getElementById('countdownWrap').style.display = 'none';
      openCurrent(true);
    }
  }, 1000);
}

function cancelCountdown() {
  if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
  document.getElementById('countdownWrap').style.display = 'none';
}

function updateRing() {
  const pct = cdSec / 10;
  document.getElementById('ringFill').style.strokeDashoffset = CIRC * (1 - pct);
  document.getElementById('ringNum').textContent = cdSec;
}

// ── Load Excel / CSV (replace all) ───────────────────────────────
const URL_TEMPLATE = id => `https://mscd1.duoctrexanh.workers.dev/result?notifyNo=${id}&refresh=1`;

function buildData(rows) {
  // rows = array of arrays; skip header row if first cell looks like a header
  const startRow = rows.length && String(rows[0][0]).toLowerCase().includes('notify') ? 1 : 0;
  const out = [];
  for (let i = startRow; i < rows.length; i++) {
    // grab first non-empty cell as notifyNo
    const id = String(rows[i][0] || '').trim();
    if (!id) continue;
    // if second column has a URL, use it; otherwise build from template
    const col1 = String(rows[i][1] || '').trim();
    const url = col1.startsWith('http') ? col1 : URL_TEMPLATE(id);
    out.push({ id, url });
  }
  return out;
}

function applyNewData(newData, filename) {
  DATA = newData;
  done.clear();
  currentIdx = 0;
  saveData(); saveDone(); savePos();
  cancelCountdown();
  resetFiltered();
  updateProgress(); updateCard(); renderList();
  showToast(`✅ Đã load ${DATA.length} link từ ${filename}`);
}

function loadExcel(input) {
  const file = input.files[0];
  if (!file) return;
  if (!confirm(`Load "${file.name}" sẽ XOÁ toàn bộ ${DATA.length} link hiện tại và reset done state. Tiếp tục?`)) {
    input.value = ''; return;
  }
  const isCsv = file.name.toLowerCase().endsWith('.csv');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let rows;
      if (isCsv) {
        // parse CSV manually (handles comma or tab separator)
        const text = e.target.result;
        const sep = text.includes('\t') ? '\t' : ',';
        rows = text.split(/\r?\n/).map(l => l.split(sep).map(c => c.replace(/^"|"$/g, '').trim()));
      } else {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      }
      const newData = buildData(rows);
      if (!newData.length) { showToast('❌ Không tìm thấy dữ liệu'); input.value = ''; return; }
      applyNewData(newData, file.name);
      startCountdown();
    } catch(err) { showToast('❌ Lỗi: ' + err.message); }
    input.value = '';
  };
  if (isCsv) reader.readAsText(file, 'UTF-8');
  else reader.readAsArrayBuffer(file);
}

// ── UI ────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function resetFiltered(query) {
  const q = (query !== undefined ? query : document.getElementById('searchInput').value).trim().toLowerCase();
  filtered = q ? DATA.map((_, i) => i).filter(i => DATA[i].id.toLowerCase().includes(q)) : DATA.map((_, i) => i);
}

function updateProgress() {
  const pct = DATA.length ? done.size / DATA.length * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done.size} / ${DATA.length} (${Math.round(pct)}%)`;
}

function updateCard() {
  if (!DATA.length) { document.getElementById('curLink').textContent = '—'; return; }
  const item = DATA[currentIdx];
  const link = document.getElementById('curLink');
  link.textContent = item.id;
  link.href = item.url;
  document.getElementById('curUrl').textContent = item.url;
  document.getElementById('curDone').innerHTML = done.has(item.id) ? '<span class="done-badge">✓ Đã mở</span>' : '';
}

function markCurrentDone() {
  // called when user clicks hyperlink directly
  if (!DATA.length) return;
  done.add(DATA[currentIdx].id);
  saveDone();
  updateProgress(); updateCard();
  const el = document.querySelector(`.list-item[data-idx="${currentIdx}"]`);
  if (el) { el.classList.add('done'); el.querySelector('.item-check')?.classList.add('checked'); }
}

function renderList() {
  const wrap = document.getElementById('listWrap');
  wrap.innerHTML = '';
  const frag = document.createDocumentFragment();
  filtered.forEach(i => {
    const item = DATA[i];
    const isDone = done.has(item.id);
    const div = document.createElement('div');
    div.className = 'list-item' + (i === currentIdx ? ' active' : '') + (isDone ? ' done' : '');
    div.dataset.idx = i;
    div.innerHTML = `<span class="item-idx">${i+1}</span><span class="item-id">${item.id}</span><span class="item-check${isDone ? ' checked' : ''}"></span>`;
    div.onclick = () => jumpTo(i);
    frag.appendChild(div);
  });
  wrap.appendChild(frag);
  document.getElementById('listInfo').textContent = `${filtered.length} / ${DATA.length} mục`;
  wrap.querySelector('.list-item.active')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function jumpTo(i) {
  cancelCountdown();
  currentIdx = i;
  updateCard(); renderList(); savePos();
  startCountdown();
}

function move(dir) {
  const fi = filtered.indexOf(currentIdx);
  let next = Math.max(0, Math.min(filtered.length - 1, fi + dir));
  jumpTo(filtered[next]);
}

function openCurrent(auto = false) {
  if (!DATA.length) return;
  const item = DATA[currentIdx];
  window.open(item.url, '_blank');
  done.add(item.id);
  saveDone();
  updateProgress(); updateCard();
  const el = document.querySelector(`.list-item[data-idx="${currentIdx}"]`);
  if (el) { el.classList.add('done'); el.querySelector('.item-check')?.classList.add('checked'); }
  // advance
  const fi = filtered.indexOf(currentIdx);
  if (fi < filtered.length - 1) {
    const nextIdx = filtered[fi + 1];
    currentIdx = nextIdx;
    updateCard(); renderList(); savePos();
    startCountdown(); // continues only if playing
  } else {
    stopPlay();
    showToast('✅ Đã hết danh sách!');
  }
}

function onSearch(q) { resetFiltered(q); renderList(); }

function clearDB() {
  if (!confirm('Xóa toàn bộ DB (data + done state)? Sẽ về lại danh sách gốc.')) return;
  localStorage.removeItem(DATA_KEY);
  localStorage.removeItem(DONE_KEY);
  localStorage.removeItem(POS_KEY);
  DATA = [...SEED];
  done.clear();
  currentIdx = 0;
  stopPlay();
  resetFiltered();
  updateProgress(); updateCard(); renderList();
  showToast('🗑 Đã xóa DB, về lại danh sách gốc');
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); cancelCountdown(); openCurrent(); }
  else if (e.key === 'Escape') cancelCountdown();
});

loadState();
resetFiltered();
updateProgress(); updateCard(); renderList();
</script>
</body>
</html>
