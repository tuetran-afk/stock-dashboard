const STORAGE_KEY = 'null_links_done_v1';

let current = 0;
let done = new Set();
let filtered = DATA.map((_, i) => i); // indices into DATA

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) done = new Set(JSON.parse(saved));
  } catch(e) {}
  // restore last position
  const pos = parseInt(localStorage.getItem(STORAGE_KEY + '_pos') || '0');
  current = isNaN(pos) ? 0 : Math.min(pos, DATA.length - 1);
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...done]));
  localStorage.setItem(STORAGE_KEY + '_pos', current);
}

function updateProgress() {
  const pct = done.size / DATA.length * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done.size} / ${DATA.length} (${Math.round(pct)}%)`;
}

function updateCard() {
  const item = DATA[current];
  document.getElementById('curId').textContent = item.id;
  document.getElementById('curUrl').textContent = item.url;
  const doneBadge = document.getElementById('curDone');
  doneBadge.innerHTML = done.has(current) ? '<span class="done-badge">✓ Đã mở</span>' : '';
}

function renderList() {
  const wrap = document.getElementById('listWrap');
  // Only render visible portion for performance (virtual-lite)
  wrap.innerHTML = '';
  const frag = document.createDocumentFragment();
  filtered.forEach(i => {
    const item = DATA[i];
    const div = document.createElement('div');
    div.className = 'list-item' + (i === current ? ' active' : '') + (done.has(i) ? ' done' : '');
    div.dataset.idx = i;
    div.innerHTML = `
      <span class="item-idx">${i+1}</span>
      <span class="item-id">${item.id}</span>
      <span class="item-check${done.has(i) ? ' checked' : ''}"></span>
    `;
    div.onclick = () => jumpTo(i);
    frag.appendChild(div);
  });
  wrap.appendChild(frag);
  scrollActiveIntoView();
  document.getElementById('listInfo').textContent = `${filtered.length} / ${DATA.length} mục`;
}

function scrollActiveIntoView() {
  const el = document.querySelector('.list-item.active');
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function jumpTo(i) {
  current = i;
  updateCard();
  renderList();
  saveState();
}

function move(dir) {
  // find current in filtered
  const fi = filtered.indexOf(current);
  let next = fi + dir;
  if (next < 0) next = 0;
  if (next >= filtered.length) next = filtered.length - 1;
  jumpTo(filtered[next]);
}

function openCurrent() {
  const item = DATA[current];
  window.open(item.url, '_blank');
  done.add(current);
  updateProgress();
  updateCard();
  // update just this item in list without full re-render
  const el = document.querySelector(`.list-item[data-idx="${current}"]`);
  if (el) {
    el.classList.add('done');
    const check = el.querySelector('.item-check');
    if (check) check.classList.add('checked');
  }
  saveState();
  // auto advance
  move(1);
}

function onSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) {
    filtered = DATA.map((_, i) => i);
  } else {
    filtered = DATA.map((_, i) => i).filter(i => DATA[i].id.toLowerCase().includes(q));
  }
  renderList();
}

function resetAll() {
  if (!confirm(`Reset tất cả ${done.size} mục đã đánh dấu?`)) return;
  done.clear();
  current = 0;
  saveState();
  updateProgress();
  updateCard();
  renderList();
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); openCurrent(); }
});

loadState();
updateProgress();
updateCard();
renderList();
</script>
