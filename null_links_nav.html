<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  header { background: #1e293b; border-bottom: 1px solid #334155; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
  header h1 { font-size: 14px; font-weight: 600; color: #94a3b8; white-space: nowrap; }

  .progress-wrap { flex: 1; min-width: 100px; }
  .progress-bar { height: 5px; background: #334155; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: #22c55e; border-radius: 3px; transition: width 0.3s; }
  .progress-text { font-size: 11px; color: #64748b; margin-top: 3px; text-align: right; }

  .controls { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .btn { border: none; border-radius: 6px; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .btn-prev { background: #334155; color: #94a3b8; }
  .btn-prev:hover { background: #475569; }
  .btn-open { background: #2563eb; color: white; font-size: 14px; padding: 8px 18px; }
  .btn-open:hover { background: #1d4ed8; }
  .btn-next { background: #334155; color: #94a3b8; }
  .btn-next:hover { background: #475569; }
  .btn-load { background: #0f766e; color: #99f6e4; font-size: 12px; padding: 6px 10px; }
  .btn-load:hover { background: #0d9488; }
  .btn-playpause { background: #4a1d96; color: #c4b5fd; }
  .btn-playpause:hover { background: #5b21b6; }
  .btn-playpause.running { background: #7c2d12; color: #fdba74; }
  .btn-playpause.running:hover { background: #9a3412; }
  .btn-reset:hover { background: #991b1b; }
  #fileInput { display: none; }

  .main { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }

  .current-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; flex-shrink: 0; }
  .current-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .current-id-row { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
  .current-id { font-size: 19px; font-weight: 700; color: #60a5fa; font-family: monospace; text-decoration: none; }
  .current-id:hover { color: #93c5fd; text-decoration: underline; }
  .current-url { font-size: 11px; color: #475569; word-break: break-all; }
  .done-badge { display: inline-block; background: #14532d; color: #4ade80; font-size: 11px; padding: 2px 8px; border-radius: 99px; margin-top: 5px; }

  /* countdown ring */
  .countdown-wrap { display: flex; align-items: center; gap: 8px; }
  .ring-svg { transform: rotate(-90deg); cursor: pointer; }
  .ring-bg { fill: none; stroke: #334155; stroke-width: 3; }
  .ring-fill { fill: none; stroke: #3b82f6; stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 50.27; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
  .ring-num { font-size: 11px; color: #94a3b8; min-width: 18px; text-align: center; }
  .btn-cancel { background: #334155; color: #94a3b8; font-size: 11px; padding: 3px 8px; border: none; border-radius: 4px; cursor: pointer; }
  .btn-cancel:hover { background: #475569; }

  .list-header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .list-header span { font-size: 12px; color: #64748b; }
  .search-input { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 5px 9px; color: #e2e8f0; font-size: 13px; width: 150px; outline: none; }
  .search-input:focus { border-color: #3b82f6; }

  .list-wrap { flex: 1; min-height: 0; overflow-y: auto; background: #1e293b; border: 1px solid #334155; border-radius: 10px; }
  .list-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #1a2332; cursor: pointer; transition: background 0.1s; }
  .list-item:last-child { border-bottom: none; }
  .list-item:hover { background: #273548; }
  .list-item.active { background: #1e3a5f; border-left: 3px solid #3b82f6; }
  .list-item.done { opacity: 0.4; }
  .item-idx { font-size: 11px; color: #475569; width: 36px; flex-shrink: 0; text-align: right; }
  .item-id { font-size: 13px; font-family: monospace; color: #e2e8f0; flex: 1; }
  .item-check { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #334155; flex-shrink: 0; position: relative; }
  .item-check.checked { background: #22c55e; border-color: #22c55e; }
  .item-check.checked::after { content: ""; position: absolute; left: 3px; top: 1px; width: 5px; height: 8px; border: 2px solid white; border-top: none; border-left: none; transform: rotate(45deg); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e3a5f; color: #93c5fd; border: 1px solid #3b82f6; border-radius: 8px; padding: 8px 16px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🔗 Null Links</h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>
  <div class="controls">
    <button class="btn btn-prev" onclick="move(-1)" title="←">◀</button>
    <button class="btn btn-open" onclick="openCurrent()" title="Space/Enter">🔗 Mở</button>
    <button class="btn btn-next" onclick="move(1)" title="→">▶</button>
    <button class="btn btn-playpause" id="btnPlay" onclick="togglePlay()" title="P">▶ Chạy</button>
    <button class="btn btn-load" onclick="document.getElementById('fileInput').click()">📂 Load Excel</button>
    <button class="btn btn-reset" onclick="clearDB()">🗑 Xóa DB</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="loadExcel(this)">
  </div>
</header>

<div class="main">
  <div class="current-card">
    <div class="current-label">Đang chọn</div>
    <div class="current-id-row">
      <a class="current-id" id="curLink" href="#" target="_blank" onclick="markCurrentDone()">—</a>
      <div class="countdown-wrap" id="countdownWrap" style="display:none">
        <svg class="ring-svg" width="22" height="22" viewBox="0 0 22 22" onclick="cancelCountdown()">
          <circle class="ring-bg" cx="11" cy="11" r="8"/>
          <circle class="ring-fill" id="ringFill" cx="11" cy="11" r="8"/>
        </svg>
        <span class="ring-num" id="ringNum">10</span>
        <button class="btn-cancel" onclick="cancelCountdown()">✕</button>
      </div>
    </div>
    <div class="current-url" id="curUrl">—</div>
    <div id="curDone"></div>
  </div>

  <div class="list-header">
    <span id="listInfo"></span>
    <input class="search-input" id="searchInput" placeholder="🔍 Tìm notifyNo..." oninput="onSearch(this.value)">
  </div>

  <div class="list-wrap" id="listWrap"></div>
</div>

<div class="toast" id="toast"></div>
